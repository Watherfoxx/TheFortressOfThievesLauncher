# module du helios launcher
name: Launcher Build
on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  create_release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Get version
        id: version
        run: echo "value=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.value }}
          release_name: release ${{ steps.version.outputs.value }}
          draft: true
          prerelease: ${{ contains(steps.version.outputs.value, 'beta') || contains(steps.version.outputs.value, 'alpha') }}

  build-launcher:
    needs: create_release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Le build macOS produit les artefacts x64 et ARM64. Le runner Intel est
        # conservé explicitement pour que electron-builder génère aussi les DMG.
        os: [macos-15-intel, ubuntu-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v1

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: 22.12.0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.x

      - name: Install Dependencies
        run: npm ci
        shell: bash

      - name: Build
        env:
          DISCORD_CRASH_WEBHOOK_URL: ${{ secrets.DISCORD_CRASH_WEBHOOK_URL }}
          ELECTRON_BUILDER_PUBLISH: never
        run: npm run build
        shell: bash

      - name: Store release files
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            dist/latest*.yml
            dist/*.exe
            dist/*.exe.blockmap
            dist/*.dmg
            dist/*.zip
            dist/*.zip.blockmap
            dist/*.AppImage
            dist/*.AppImage.blockmap
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  publish-release:
    needs: [create_release, build-launcher]
    runs-on: ubuntu-latest
    steps:
      - name: Download platform release files
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Normalize release filenames
        run: |
          for file in dist/*\ *; do
            test -e "$file" || continue
            target="${file// /-}"
            echo "Renommage : $(basename "$file") -> $(basename "$target")"
            mv "$file" "$target"
          done
          echo "Fichiers collectés :"
          find dist -maxdepth 1 -type f -printf '%f\n' | sort
        shell: bash

      - name: Verify collected release files
        id: verify_files
        run: |
          metadata_files=(latest.yml latest-mac.yml latest-linux.yml)
          required_assets_list=("${metadata_files[@]}")
          for metadata in "${metadata_files[@]}"; do
            test -s "dist/${metadata}" || { echo "Métadonnées manquantes : ${metadata}"; exit 1; }

            while IFS= read -r asset; do
              test -n "$asset" || continue
              test -s "dist/${asset}" || {
                echo "${metadata} référence un fichier absent : ${asset}"
                exit 1
              }
              required_assets_list+=("$asset")
            done < <(sed -nE 's/^[[:space:]]*- url:[[:space:]]*(.+)[[:space:]]*$/\1/p' "dist/${metadata}")
          done

          required_assets="$(printf '%s\n' "${required_assets_list[@]}" | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          test "$required_assets" != "[]" || { echo "Aucun fichier de release collecté"; exit 1; }
          echo "required_assets=${required_assets}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Upload all release files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create_release.outputs.release_id }}
        run: |
          test -n "$RELEASE_ID" || { echo "Identifiant de release absent"; exit 1; }

          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --jq '.[].id' |
            while IFS= read -r asset_id; do
              test -n "$asset_id" || continue
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            done

          for file in dist/*; do
            test -f "$file" || continue
            name="$(basename "$file")"
            encoded_name="$(jq -rn --arg value "$name" '$value | @uri')"
            echo "Upload vers la release ${RELEASE_ID} : ${name}"
            curl --fail-with-body --retry 3 --retry-all-errors \
              --request POST \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/octet-stream" \
              --data-binary "@${file}" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${encoded_name}"
          done
        shell: bash

      - name: Publish completed release
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ needs.create_release.outputs.version }}
          RELEASE_ID: ${{ needs.create_release.outputs.release_id }}
          REQUIRED_ASSETS: ${{ steps.verify_files.outputs.required_assets }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const releaseId = Number(process.env.RELEASE_ID)
            if (!Number.isSafeInteger(releaseId) || releaseId <= 0) {
              core.setFailed(`Identifiant de release invalide : ${process.env.RELEASE_ID || 'absent'}`)
              return
            }

            const requiredAssets = JSON.parse(process.env.REQUIRED_ASSETS || '[]')
            if (requiredAssets.length === 0) {
              core.setFailed('La liste des fichiers à publier est vide.')
              return
            }
            let missingAssets = requiredAssets

            for (let attempt = 1; attempt <= 24; attempt++) {
              const releaseAssets = await github.paginate(github.rest.repos.listReleaseAssets, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId,
                per_page: 100
              })
              const uploadedAssets = new Set(releaseAssets.map(asset => asset.name))
              missingAssets = requiredAssets.filter(asset => !uploadedAssets.has(asset))

              if (missingAssets.length === 0) break
              core.info(`Assets pas encore visibles (tentative ${attempt}/24) : ${missingAssets.join(', ')}`)
              await new Promise(resolve => setTimeout(resolve, 5000))
            }

            if (missingAssets.length > 0) {
              core.setFailed(`Release incomplète, fichiers manquants : ${missingAssets.join(', ')}`)
              return
            }

            const { data: release } = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId
            })

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              draft: false,
              prerelease: /(?:alpha|beta)/i.test(process.env.RELEASE_VERSION)
            })
