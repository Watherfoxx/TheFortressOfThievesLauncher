# module du helios launcher
name: Launcher Build
on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Get version
        id: version
        run: echo "value=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
      
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.value }}
          release_name: release ${{ steps.version.outputs.value }}
          draft: true
          prerelease: ${{ contains(steps.version.outputs.value, 'beta') || contains(steps.version.outputs.value, 'alpha') }}

  build-launcher:
    needs: create-release
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v1

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: 22.12.0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.x

      - name: Install Dependencies
        run: npm ci
        shell: bash

      - name: Build
        env:
          GH_TOKEN: ${{ secrets.github_token }}
          DISCORD_CRASH_WEBHOOK_URL: ${{ secrets.DISCORD_CRASH_WEBHOOK_URL }}
        run: npm run build
        shell: bash

      - name: Verify Linux update metadata
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.github_token }}
        run: |
          test -s dist/latest-linux.yml
          grep -q '^version:' dist/latest-linux.yml
          grep -q 'sha512:' dist/latest-linux.yml
          grep -q '\.AppImage' dist/latest-linux.yml
          version="$(node -p "require('./package.json').version")"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${version}" \
            --jq '.assets[].name' | grep -Fxq 'latest-linux.yml'
        shell: bash

  publish-release:
    needs: [create-release, build-launcher]
    runs-on: ubuntu-latest
    steps:
      - name: Publish completed release
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ needs.create-release.outputs.version }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: process.env.RELEASE_VERSION
            })

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              draft: false,
              prerelease: /(?:alpha|beta)/i.test(process.env.RELEASE_VERSION)
            })
