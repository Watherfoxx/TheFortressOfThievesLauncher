# module du helios launcher
name: Launcher Build
on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  create_release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Get version
        id: version
        run: echo "value=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.value }}
          release_name: release ${{ steps.version.outputs.value }}
          draft: true
          prerelease: ${{ contains(steps.version.outputs.value, 'beta') || contains(steps.version.outputs.value, 'alpha') }}

  build-launcher:
    needs: create_release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v1

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: 22.12.0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.x

      - name: Install Dependencies
        run: npm ci
        shell: bash

      - name: Build
        env:
          DISCORD_CRASH_WEBHOOK_URL: ${{ secrets.DISCORD_CRASH_WEBHOOK_URL }}
          ELECTRON_BUILDER_PUBLISH: never
        run: npm run build
        shell: bash

      - name: Store release files
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            dist/latest*.yml
            dist/*.exe
            dist/*.exe.blockmap
            dist/*.dmg
            dist/*.zip
            dist/*.zip.blockmap
            dist/*.AppImage
            dist/*.AppImage.blockmap
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  publish-release:
    needs: [create_release, build-launcher]
    runs-on: ubuntu-latest
    steps:
      - name: Download platform release files
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify collected release files
        run: |
          required=(
            latest.yml
            latest-mac.yml
            latest-linux.yml
            The-Fortress-Of-Thieves-win-x64.exe
            The-Fortress-Of-Thieves-mac-x64.zip
            The-Fortress-Of-Thieves-mac-arm64.zip
            The-Fortress-Of-Thieves-linux-x86_64.AppImage
          )
          for file in "${required[@]}"; do
            test -s "dist/${file}" || { echo "Fichier manquant ou vide : ${file}"; exit 1; }
          done
        shell: bash

      - name: Upload all release files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.create_release.outputs.version }}
        run: gh release upload "$RELEASE_VERSION" dist/* --clobber --repo "$GITHUB_REPOSITORY"
        shell: bash

      - name: Publish completed release
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ needs.create_release.outputs.version }}
          RELEASE_ID: ${{ needs.create_release.outputs.release_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const releaseId = Number(process.env.RELEASE_ID)
            if (!Number.isSafeInteger(releaseId) || releaseId <= 0) {
              core.setFailed(`Identifiant de release invalide : ${process.env.RELEASE_ID || 'absent'}`)
              return
            }

            const requiredAssets = [
              'latest.yml',
              'latest-mac.yml',
              'latest-linux.yml',
              'The-Fortress-Of-Thieves-win-x64.exe',
              'The-Fortress-Of-Thieves-mac-x64.zip',
              'The-Fortress-Of-Thieves-mac-arm64.zip',
              'The-Fortress-Of-Thieves-linux-x86_64.AppImage'
            ]
            let release
            let missingAssets = requiredAssets

            for (let attempt = 1; attempt <= 24; attempt++) {
              const response = await github.rest.repos.getRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId
              })
              release = response.data
              const uploadedAssets = new Set(release.assets.map(asset => asset.name))
              missingAssets = requiredAssets.filter(asset => !uploadedAssets.has(asset))

              if (missingAssets.length === 0) break
              core.info(`Assets pas encore visibles (tentative ${attempt}/24) : ${missingAssets.join(', ')}`)
              await new Promise(resolve => setTimeout(resolve, 5000))
            }

            if (missingAssets.length > 0) {
              core.setFailed(`Release incomplète, fichiers manquants : ${missingAssets.join(', ')}`)
              return
            }

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              draft: false,
              prerelease: /(?:alpha|beta)/i.test(process.env.RELEASE_VERSION)
            })
